# =========================================
# Juroc website — services to MERGE into the existing trainee stack
# =========================================
# These are NOT a standalone stack. Paste them into the same
# docker-compose.yml that runs trainee_db / trainee_api / trainee_nginx.
#
# Why merging matters: that compose file defines no explicit networks, so its
# services share one implicit default network and resolve each other by service
# name. Running this as a SEPARATE compose project would put it on a different
# network, and trainee_nginx would fail to resolve juroc_site_api. If you would
# rather keep them separate, declare an external shared network in both.

services:

  # ---- Add this service ----
  juroc-site-api:
    # Absolute paths on purpose. The compose file lives in ~/Trainee/server/,
    # and the marketing site is a separate project — nesting its checkout
    # inside the Trainee tree just to satisfy a relative path would be worse.
    build: /home/robi/jurocwebsite/server
    container_name: juroc_site_api
    restart: unless-stopped
    env_file: /home/robi/jurocwebsite/server/.env
    environment:
      NODE_ENV: production
      PORT: 3001
      # Must be 0.0.0.0 in a container so nginx can reach it across the network.
      BIND_HOST: 0.0.0.0
    # Not published to the host — nginx is the only public entrypoint,
    # exactly as with trainee_api.
    expose:
      - "3001"
    healthcheck:
      # node:20-slim has no curl or wget; Node 20 has global fetch built in.
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ---- Modify your existing nginx service: add the static site mount ----
  # nginx:
  #   volumes:
  #     - ./nginx/conf.d:/etc/nginx/conf.d:ro
  #     - certbot_www:/var/www/certbot:ro
  #     - certbot_conf:/etc/letsencrypt:ro
  #     - /home/robi/jurocwebsite:/var/www/juroc.tech:ro   # <-- ADD
  #   depends_on:
  #     - app
  #     - juroc-site-api                                   # <-- ADD
  #
  # depends_on only controls start order, not readiness. nginx starting before
  # the API is fine here: it will 502 for a few seconds, then recover. It does
  # NOT tolerate a missing upstream *name* at startup — see the resolver note
  # in nginx/juroc.tech.conf.
