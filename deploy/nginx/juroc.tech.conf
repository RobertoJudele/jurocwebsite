# =========================================
# Juroc marketing site + contact API
# =========================================
# Drop into ~/Trainee/server/nginx/conf.d/ alongside app.conf.
# Additive: app.conf owns api.juroc.tech, this owns juroc.tech + www.
# app.conf is never modified.
#
# Conventions deliberately mirrored from app.conf: webroot ACME, no IPv6
# listeners, certbot's shared TLS options, and request-time upstream
# resolution via a variable.
#
# The certificate for juroc.tech was issued and the 443 block went live on the
# VPS during the original cutover, so it ships uncommented here to match what
# production actually runs.
#
# If you ever rebuild this from scratch on a host with no certificate yet:
# comment the 443 block out again first. nginx refuses to start when
# ssl_certificate points at a missing file, and this config shares a container
# with api.juroc.tech — a failed start takes that down too. Serve HTTP only,
# issue the cert (deploy/README.md step 7), then restore the block.

# ---- HTTP: ACME challenge + redirect everything else to HTTPS ----
server {
    listen 80;
    server_name juroc.tech www.juroc.tech;

    # Same certbot_www volume the trainee stack already uses.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ---- HTTPS: the site itself ----
server {
    listen 443 ssl;
    http2 on;
    server_name juroc.tech www.juroc.tech;

    ssl_certificate     /etc/letsencrypt/live/juroc.tech/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/juroc.tech/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # Bind-mounted from /home/robi/jurocwebsite
    root /var/www/juroc.tech;
    index index.html;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 512;

    # Same request-time resolution as app.conf: a literal hostname in
    # proxy_pass makes nginx resolve once at startup and exit if the
    # container is not up — which would take api.juroc.tech down with it.
    resolver 127.0.0.11 valid=30s ipv6=off;
    set $juroc_api juroc-site-api:3001;

    # No client_max_body_size override: this endpoint accepts a small JSON
    # body (capped at 32kb in Express), so nginx's 1 MB default is ample.
    location /api/ {
        proxy_pass http://$juroc_api$request_uri;
        proxy_http_version 1.1;

        # Express `trust proxy` + rate limiting need the real client IP.
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 30s;
    }

    location ~* \.(css|js|svg|png|jpg|jpeg|webp|ico|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Serve .html pages without the extension in the URL. This is what makes
    # /delete-account resolve to delete-account.html.
    location / {
        try_files $uri $uri.html $uri/ =404;
    }

    # The repo is bind-mounted whole; never serve these.
    location ~ ^/(server|deploy|\.github|\.git)/ {
        deny all;
        return 404;
    }
}
