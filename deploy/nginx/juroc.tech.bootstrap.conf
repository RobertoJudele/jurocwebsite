# =========================================
# Juroc marketing site — CUTOVER BOOTSTRAP (temporary)
# =========================================
# Use this INSTEAD of juroc.tech.conf for the DNS cutover window only, then
# replace it with the real config once the certificate exists.
#
# Why it exists: juroc.tech currently serves from GitHub Pages over HTTPS.
# certbot's HTTP-01 challenge cannot run until DNS points here, but the moment
# it does, this server has no certificate for juroc.tech yet. If the :80 block
# redirected to HTTPS at that point, browsers would fall through to the
# api.juroc.tech 443 block and show a certificate-name-mismatch error — a
# harder failure than the old site.
#
# So during the window this serves the site over plain HTTP. That is only safe
# because juroc.tech sends no HSTS header today (verified with
# `curl -sI https://juroc.tech`). If that ever changes, do NOT use this file —
# use a DNS-01 challenge to obtain the certificate before touching DNS.
#
# Window is minutes: flip DNS, run certbot, swap in the real config.

server {
    listen 80;
    server_name juroc.tech www.juroc.tech;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    root /var/www/juroc.tech;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 512;

    resolver 127.0.0.11 valid=30s ipv6=off;
    set $juroc_api juroc-site-api:3001;

    location /api/ {
        proxy_pass http://$juroc_api$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    location ~* \.(css|js|svg|png|jpg|jpeg|webp|ico|woff2?)$ {
        expires 30d;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri.html $uri/ =404;
    }

    location ~ ^/(server|deploy|\.github|\.git)/ {
        deny all;
        return 404;
    }
}
